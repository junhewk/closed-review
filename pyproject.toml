[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "closed-review"
version = "0.9.0.dev5"
description = "Confidential journal peer review on a model you control, for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Junhewk Kim" }]
keywords = ["peer review", "journal", "manuscript", "hermes-agent", "local llm", "confidentiality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "filelock>=3.15,<4",
  "httpx>=0.27,<1",
  "pdfminer.six>=20240706",
  "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/junhewk/closed-review"
Repository = "https://github.com/junhewk/closed-review"
Issues = "https://github.com/junhewk/closed-review/issues"
Releases = "https://github.com/junhewk/closed-review/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
creview = "closed_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/closed_review"]

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "docs", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
